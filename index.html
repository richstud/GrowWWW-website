<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <link rel="preload" as="image" href="/images/logo-loading.webp" />
    <meta name="theme-color" content="#0e0c0a" />
    <meta name="apple-mobile-web-app-title" content="GrowWWW" />
    <meta name="author" content="GrowWWW" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Development defaults. On `npm run build`, scripts/prerender-seo.mjs replaces these
         with each page's own title, description, canonical, social tags and structured data
         (edit the text in src/seo/seo.config.json). -->
    <title>Website, App & Automation Company in India | GrowWWW</title>
    <meta name="description" content="GrowWWW builds fast websites, mobile apps, business automation and digital marketing for Indian businesses and MSMEs. Since 2015." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GrowWWW" />
    <meta property="og:image" content="https://www.growwww.in/images/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Before the app loads, visitors see a logo loading screen. The page text underneath stays in the HTML for
         search engines and link previews, and shows by itself if the app hasn't started after 8 seconds. -->
    <style>
      html, body { background: #0f0d0b; margin: 0; }
      .seo-shell { color: #ece4d6; font: 16px/1.65 "Hanken Grotesk", system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 96px 20px 64px; }
      .seo-shell h1 { font: 500 clamp(2.2rem, 6vw, 3.6rem)/1.05 "Bodoni Moda", Georgia, serif; margin: 0 0 20px; }
      .seo-shell h2 { font: 500 1.6rem/1.2 "Bodoni Moda", Georgia, serif; margin: 40px 0 12px; color: #d9a955; }
      .seo-shell h3 { font-size: 1rem; margin: 20px 0 4px; }
      .seo-shell p, .seo-shell li { color: #b8ad9c; }
      .seo-shell a { color: #d9a955; text-decoration: none; }
      .seo-shell nav { position: fixed; inset: 0 0 auto; padding: 22px 20px; background: #0f0d0b; border-bottom: 1px solid #2a241c; font-size: 14px; }
      .seo-shell ul { padding-left: 18px; }
      .seo-shell::before { content: ""; position: fixed; inset: 0; z-index: 1; background: #0a0a0a url(/images/logo-loading.webp) center / 150px no-repeat; animation: seo-reveal 0.4s ease 8s forwards; }
      .seo-bar { position: fixed; top: 0; left: 0; height: 2px; width: 30%; background: #d9a955; animation: seo-load 1.4s ease-in-out infinite; z-index: 2; }
      @keyframes seo-reveal { to { opacity: 0; visibility: hidden; } }
      @keyframes seo-load { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .seo-bar { animation: none; width: 100%; opacity: 0.4; } }
    </style>
    <noscript><style>.seo-shell::before, .seo-bar { display: none; }</style></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
