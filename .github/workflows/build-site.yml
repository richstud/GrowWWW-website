# Builds the website and puts the finished files on the `deploy` branch.
# Serverbyt's Git Version Control pulls that branch into public_html.
#
# Runs when code changes on main, every Monday (so products / portfolio added in
# admin get their own Google-friendly page and sitemap entry), or by hand from
# the Actions tab ("Run workflow").
name: Build website

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/keepalive.txt"
      - "**.md"
  schedule:
    - cron: "23 22 * * 0"   # Monday 03:53 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (Vite + SEO pages + sitemap)
        run: npm run build

      - name: Check the build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/sitemap.xml
          ls dist/assets | head
          echo "Pages: $(find dist -name '*.html' | wc -l)"

      - name: Publish to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website build from ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Published $(git rev-parse --short HEAD) to the deploy branch"
