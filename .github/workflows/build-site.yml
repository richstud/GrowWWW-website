# Builds the website and puts the finished files on the `deploy` branch.
# Serverbyt's Git Version Control pulls that branch into public_html.
#
# Runs when code changes on main, every Monday (so products / portfolio added in
# admin get their own Google-friendly page and sitemap entry), or by hand from
# the Actions tab ("Run workflow").
name: Build website

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/keepalive.txt"
      - "**.md"
  schedule:
    - cron: "23 22 * * 0"   # Monday 03:53 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (Vite + SEO pages + sitemap)
        run: npm run build

      - name: Check the build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/sitemap.xml
          ls dist/assets | head
          echo "Pages: $(find dist -name '*.html' | wc -l)"

      - name: Add the server copy script
        run: |
          mkdir -p dist/_deploy
          cat > dist/_deploy/deploy.sh <<'SH'
          #!/bin/bash
          # Run by Serverbyt Git Version Control after it pulls this branch.
          # Copies the website into public_html. It only adds or replaces files, so
          # anything uploaded straight to the host (like the favicon) is kept.
          set -e
          SRC="$(cd "$(dirname "$0")/.." && pwd)"
          DEST="/home/sites/39b/c/c94bf59ddd/public_html"
          [ -d "$DEST" ] || DEST="$HOME/public_html"
          [ -d "$DEST" ] || { echo "public_html not found"; exit 1; }
          cd "$SRC"
          tar --exclude=./.git --exclude=./_deploy -cf - . | (cd "$DEST" && tar -xf -)
          echo "Website copied to $DEST"
          SH
          sed -i 's/^          //' dist/_deploy/deploy.sh
          chmod +x dist/_deploy/deploy.sh

      - name: Publish to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website build from ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Published $(git rev-parse --short HEAD) to the deploy branch"
